name: Gate

# Fast per-push tier: harness lint, the changed-suite unit run on the minimum
# pin, and the reference/oracle negative controls when tooling changes. The full
# matrix qualifies merges to main (reference-baseline.yml); nightly.yml owns the
# Firefox axis and the Java model checks.

on:
  push:
    # Feature branches are verified by their pull_request Gate run; a push
    # trigger on every branch would run the whole gate twice per change.
    branches: [main]
  pull_request:
  # The merge queue builds grouped merge candidates and requires this
  # workflow's checks on them; without the trigger the queue would hang
  # waiting for checks that never report.
  merge_group:

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  harness:
    name: Harness checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"

      - name: Tooling self-tests
        run: make test-llm

      - name: Source line widths
        run: make lint-source

      - name: File length caps
        run: python3 scripts/llm/check_llm_file_lengths.py --verbose

      - name: Index freshness
        run: python3 scripts/llm/generate_llm_index.py --check

      - name: Agent stub freshness
        run: python3 scripts/llm/generate_skill_stubs.py --check

      - name: Instructions meta-lint
        run: python3 scripts/llm/lint_llm_instructions.py

      - name: Fail on uncommitted drift
        run: |
          STATUS="$(git status --porcelain)"
          if [ -n "$STATUS" ]; then
            echo "::error::Working tree dirty after lint steps (generated files committed?):"
            echo "$STATUS"
            exit 1
          fi

  detect:
    name: Detect tooling changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scripts: ${{ steps.diff.outputs.scripts }}
      unit-plan: ${{ steps.units.outputs.plan }}
      unit-indices: ${{ steps.units.outputs.indices }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        run: |
          set -o pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" || "$base" = "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.merge_group.base_sha }}"
          fi
          if [[ -z "$base" || "$base" = "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" = "0000000000000000000000000000000000000000" ]]; then
            base="unavailable"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if ! list="$(git diff --name-only "$base...HEAD" -- scripts Makefile \
              .github/workflows/gate.yml .github/workflows/reference-baseline.yml \
              .github/workflows/nightly.yml 2>/dev/null)"; then
            # An unresolvable base is the suspicious case itself: run the controls.
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$list" ]]; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          else
            echo "scripts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan affected unit suites
        id: units
        if: github.event_name != 'merge_group'
        env:
          BASE: ${{ steps.diff.outputs.base }}
        run: python3 scripts/unit_gate.py plan --base "$BASE"

  unit-part:
    name: Unit partition ${{ matrix.part }} (Godot 4.3)
    needs: detect
    if: github.event_name != 'merge_group' && fromJSON(needs.detect.outputs.unit-plan).selection.selected_count > 0
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.detect.outputs.unit-indices || '[0]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"

      - name: Prepare the pinned minimum editor
        run: |
          PYTHONPATH=scripts/reference python3 - <<'PY'
          from fetch import load_manifest, fetch, prepare_zip, CACHE
          import platform
          data = load_manifest()
          arch = {'aarch64': 'arm64', 'x86_64': 'x86_64'}.get(platform.machine())
          if arch is None:
              raise SystemExit('editor bootstrap supports Linux arm64/x86_64 only')
          version = "4.3"
          name = f'Godot_v{version}-stable_linux.{arch}.zip'
          directory = CACHE / 'editors' / version
          directory.mkdir(parents=True, exist_ok=True)
          prepare_zip(fetch(data['artifacts'][name], name, False), directory, executable_members=(name[:-4],))
          (directory / name[:-4]).chmod(0o755)
          PY

      - name: Run the affected unit suites
        env:
          UNIT_PLAN: ${{ needs.detect.outputs.unit-plan }}
          PART: ${{ matrix.part }}
        run: |
          editor=".cache/reference/editors/4.3/Godot_v4.3-stable_linux.x86_64"
          python3 scripts/unit_gate.py run --part "$PART" --godot "$editor"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: gate-unit-part-${{ matrix.part }}
          path: .cache/tests/latest.json
          if-no-files-found: error
          overwrite: true

  unit-fast:
    name: Changed unit suites (Godot 4.3)
    needs: [detect, unit-part, qualify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require full candidate qualification
        if: github.event_name == 'merge_group'
        env:
          QUALIFIED: ${{ needs.qualify.result }}
        run: test "$QUALIFIED" = success

      - uses: actions/checkout@v7.0.1
        if: github.event_name != 'merge_group'

      - uses: actions/download-artifact@v8.0.2
        if: github.event_name != 'merge_group' && needs.unit-part.result == 'success'
        with:
          pattern: gate-unit-part-*
          path: .cache/unit-artifacts

      - name: Verify partition receipts
        if: github.event_name != 'merge_group'
        env:
          DETECTED: ${{ needs.detect.result }}
          UNIT_PLAN: ${{ needs.detect.outputs.unit-plan }}
          STATUS: ${{ needs.unit-part.result }}
        run: |
          set -o pipefail
          test "$DETECTED" = success
          python3 scripts/unit_gate.py verify --artifacts .cache/unit-artifacts --status "$STATUS" | tee "$RUNNER_TEMP/unit-selection.json"

      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'merge_group' && success()
        with:
          name: gate-unit-selection
          path: ${{ runner.temp }}/unit-selection.json
          if-no-files-found: error
          overwrite: true

  control-work:
    name: Run ${{ matrix.family }} controls
    needs: detect
    if: github.event_name == 'merge_group' || needs.detect.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [reference, oracle]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - run: make test-${{ matrix.family }}

  controls:
    name: Reference and oracle negative controls
    needs: [detect, control-work]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify control results for this candidate
        env:
          DETECT: ${{ needs.detect.result }}
          CHANGED: ${{ needs.detect.outputs.scripts }}
          WORK: ${{ needs.control-work.result }}
        run: |
          test "$DETECT" = success
          if [[ "$GITHUB_EVENT_NAME" == merge_group || "$CHANGED" == true ]]; then
            test "$WORK" = success
          else
            test "$CHANGED" = false && test "$WORK" = skipped
          fi

  qualify:
    name: Qualification matrix
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/reference-baseline.yml

  qualification:
    name: Qualification summary
    needs: [controls, qualify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify required qualification evidence
        env:
          CONTROLS: ${{ needs.controls.result }}
          MATRIX: ${{ needs.qualify.result }}
        run: |
          test "$CONTROLS" = success
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            test "$MATRIX" = success
          else
            test "$MATRIX" = skipped
          fi
