name: Drift Report
# M2 (issue #52): the weekly/manual upstream drift report. The reporter only
# ever writes one deduplicated issue per pinned source; it never advances a
# pin, rewrites pins.json or regenerates fixtures, so the write scope stays at
# issues and the run is safe to schedule.
on:
  workflow_dispatch:
  schedule:
    # Mondays 06:17 UTC — off the hour so hosted-runner congestion peaks are avoided.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  issues: write

concurrency:
  # Serialize runs: two racing processes could both see zero carriers and both
  # create, so the group (not the read-before-write dedup) is what prevents
  # that here. An out-of-group manual run racing the workflow can still produce
  # two carriers; the next run then fails closed and names both until a human
  # removes the duplicate's identity marker.
  group: drift-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report upstream drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/reference/drift_report.py --summary "$GITHUB_STEP_SUMMARY" \
            --reporting-identity github-actions[bot] --output "$RUNNER_TEMP/drift-report" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload complete drift reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: drift-reports
          path: ${{ runner.temp }}/drift-report/*.json
          if-no-files-found: ignore
          overwrite: true
      - name: Failure summary
        if: failure()
        run: |
          {
            echo '### Drift report failed'
            echo
            echo 'See the failed step for source errors or artifact upload details.'
            echo 'Successful observations remain on their carrier issues.'
            echo 'Fix the reported error and rerun before making a decision about drift.'
          } >> "$GITHUB_STEP_SUMMARY"
