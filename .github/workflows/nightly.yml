name: Nightly Axes

# Nightly tier: the verification axes that moved off the per-push Gate and the
# merge-to-main qualification. The Firefox ownership matrix and the Firefox
# transport witness keep their previous labels, receipts and artifacts; the
# Java model checks (SpectatorSession model, handshake TLA+ formal check) run
# here instead of inside the qualify oracle legs. A failure here catches a
# regression in an axis the faster tiers do not exercise.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A dispatch during a scheduled run queues behind it instead of racing the
# shared relay-server build caches or overlapping the 180-minute witnesses.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ownership:
    name: Nightly Firefox snapshot ownership ${{ matrix.version }}${{ matrix.suffix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: "4.3", browser: firefox, phase: negative, suite_part: "1", suffix: " negative part 1", part_suffix: "-part-1"}
          - {version: "4.3", browser: firefox, phase: negative, suite_part: "2", suffix: " negative part 2", part_suffix: "-part-2"}
          - {version: "4.3", browser: firefox, phase: negative, suite_part: "3", suffix: " negative part 3", part_suffix: "-part-3"}
          - {version: "4.3", browser: firefox, phase: negative, suite_part: "4", suffix: " negative part 4", part_suffix: "-part-4"}
          - {version: "4.3", browser: firefox, phase: positive, suite_part: "1", suffix: " positive part 1", part_suffix: "-part-1"}
          - {version: "4.3", browser: firefox, phase: positive, suite_part: "2", suffix: " positive part 2", part_suffix: "-part-2"}
          - {version: "4.3", browser: firefox, phase: positive, suite_part: "3", suffix: " positive part 3", part_suffix: "-part-3"}
          - {version: "4.3", browser: firefox, phase: positive, suite_part: "4", suffix: " positive part 4", part_suffix: "-part-4"}
          - {version: "4.7.2", browser: firefox, phase: negative, suite_part: "1", suffix: " negative part 1", part_suffix: "-part-1"}
          - {version: "4.7.2", browser: firefox, phase: negative, suite_part: "2", suffix: " negative part 2", part_suffix: "-part-2"}
          - {version: "4.7.2", browser: firefox, phase: negative, suite_part: "3", suffix: " negative part 3", part_suffix: "-part-3"}
          - {version: "4.7.2", browser: firefox, phase: negative, suite_part: "4", suffix: " negative part 4", part_suffix: "-part-4"}
          - {version: "4.7.2", browser: firefox, phase: positive, suite_part: "1", suffix: " positive part 1", part_suffix: "-part-1"}
          - {version: "4.7.2", browser: firefox, phase: positive, suite_part: "2", suffix: " positive part 2", part_suffix: "-part-2"}
          - {version: "4.7.2", browser: firefox, phase: positive, suite_part: "3", suffix: " positive part 3", part_suffix: "-part-3"}
          - {version: "4.7.2", browser: firefox, phase: positive, suite_part: "4", suffix: " positive part 4", part_suffix: "-part-4"}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          # The browser tooling is reinstall per job; a shared npm download cache
          # keeps `npm ci` off the registry on the warm path without changing
          # what is installed.
          cache: npm
          cache-dependency-path: scripts/reference/browser/package-lock.json
      - name: Restore verified reference downloads
        uses: actions/cache@v6.1.0
        with:
          path: .cache/reference/downloads
          key: reference-ownership-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json') }}
      - name: Select Ubuntu HTTPS mirror alternatives
        run: sudo bash scripts/reference/prepare_ubuntu_apt.sh /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - name: Install pinned browser runner and operating system dependencies
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          bash scripts/reference/retry_apt_fetch.sh .cache/reference/browser/node_modules/.bin/playwright install-deps firefox
          sudo apt-get update
          sudo bash scripts/reference/retry_apt_fetch.sh apt-get install -y xvfb xdotool
      - name: Verify integer encoding, snapshot ownership and byte sessions
        run: |
          export DEBUG=pw:browser
          export DEBUG_FILE="$PWD/.cache/reference/results/ownership-firefox-process.log"
          xvfb-run -a python3 scripts/reference/ownership_probes.py --web --browser firefox \
            --version "${{ matrix.version }}" --phase "${{ matrix.phase }}" --suite-part "${{ matrix.suite_part }}"
      - name: Verify late Firefox updater lock cleanup
        if: matrix.version == '4.3' && matrix.phase == 'positive' && matrix.suite_part == '1'
        run: |
          python3 scripts/reference/firefox_shutdown_control.py \
            --firefox .cache/reference/ownership-firefox/x86_64/firefox/firefox \
            --work-dir .cache/scratch/firefox-shutdown-control \
            --output .cache/reference/results/firefox-shutdown-control
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          # The phase must stay in the name: both phases reuse the compact -part-N
          # suffixes, and upload-artifact v4+ rejects a colliding second upload.
          name: nightly-ownership-firefox-results-${{ matrix.version }}-firefox-${{ matrix.phase }}${{ matrix.part_suffix }}
          path: .cache/reference/results/
          if-no-files-found: error

  signalfish:
    # The Firefox pair is the #104 eight-player axis: it runs the same labels as
    # the Chromium pair under `xvfb-run` with the pinned Firefox installation.
    # The chromium-firefox pair stays out of every tier: its hosted 8-player
    # rooms fail ICE setup deterministically (all peers report "ICE failed, add
    # a STUN server" against the absolute setup deadline; Reference run
    # 42763413592), the same session-025 mixed-job failure class. That
    # cross-browser setup gap remains tracked in #104.
    name: Nightly SignalFish Firefox WebRTC ${{ matrix.version }} ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ["4.3", "4.7.2"]
        part: [direct, mixed]
        pair: [firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: scripts/reference/browser/package-lock.json
      - name: Restore verified transport downloads and crates
        uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-signalfish-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/reference/browser/package-lock.json') }}
      - name: Verify the pinned sources and name the server build cache
        id: pinned
        run: |
          PYTHONPATH=scripts/reference python3 - <<'PY'
          from fetch import load_manifest, sources
          manifest = load_manifest()
          trees = sources(manifest)
          lock = trees['server'] / 'Cargo.lock'
          if not lock.is_file():
              raise SystemExit('the pinned server source has no Cargo.lock')
          print(lock)
          PY
          echo "pins=$(sha256sum docs/reference/pins.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          digest="$(sha256sum .cache/reference/signal-fish-server-*/Cargo.lock scripts/reference/signalfish_build_server.py | sha256sum | cut -d' ' -f1)"
          echo "build=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore the shared relay server build tree
        uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/reference/server-target
            .cache/reference/server-cargo
          key: reference-signalfish-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pinned.outputs.pins }}-${{ steps.pinned.outputs.build }}
          restore-keys: |
            reference-signalfish-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pinned.outputs.pins }}-
      - name: Select Ubuntu HTTPS mirror alternatives
        run: sudo bash scripts/reference/prepare_ubuntu_apt.sh /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - name: Install pinned browser runner and operating system dependencies
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          bash scripts/reference/retry_apt_fetch.sh .cache/reference/browser/node_modules/.bin/playwright install-deps chromium
          bash scripts/reference/retry_apt_fetch.sh .cache/reference/browser/node_modules/.bin/playwright install-deps firefox
          sudo apt-get update
          sudo bash scripts/reference/retry_apt_fetch.sh apt-get install -y xvfb xdotool
      - name: Build the pinned local SignalFish server
        run: |
          PYTHONPATH=scripts/reference python3 - <<'PY'
          from fetch import load_manifest
          from run import setup_rust
          manifest = load_manifest()
          setup_rust(manifest, False)
          PY
          cargo="$(RUSTUP_HOME="$PWD/.cache/reference/rustup" .cache/reference/cargo/bin/rustup which --toolchain 1.99.1 cargo)"
          python3 scripts/reference/signalfish_build_server.py \
            --cargo "$cargo" \
            --source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
            --output .cache/reference/results/signalfish-server-build
      - name: Verify real browser WebRTC on the pinned engine
        # Firefox endpoints need a visible window for WebGL; Chromium rooms stay headless.
        run: |
          if [[ "${{ matrix.part }}" == direct ]]; then
            labels=(clean faults corrupt default mixed-disabled peer-drop peer-drop-corrupt peer-drop-close peer-drop-answer
                    peer-drop-relay peer-drop-missing peer-drop-second peer-drop-rollback peer-drop-foreign)
          else labels=(mixed mixed-default mixed-close recording-pressure); fi
          xvfb-run -a python3 scripts/reference/signalfish_webrtc_probe.py \
            --version "${{ matrix.version }}" "${labels[@]/#/--label=}" \
            --browser-pair firefox \
            --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
            --server-source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
            --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
            --output .cache/reference/results/signalfish-webrtc
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: nightly-signalfish-firefox-results-${{ matrix.version }}-${{ matrix.part }}
          # The build receipt keeps the server binary's digest and build log; the published copy is not evidence.
          path: |
            .cache/reference/results/
            !.cache/reference/results/signalfish-server-build/target/
          if-no-files-found: error

  models:
    name: Nightly model checks ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ["4.3", "4.7.2"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - name: Select Ubuntu HTTPS mirror alternatives
        run: sudo bash scripts/reference/prepare_ubuntu_apt.sh /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - name: Select Java 17 for scoped model checking
        run: |
          if [[ -n "${JAVA_HOME_17_X64:-}" && -x "$JAVA_HOME_17_X64/bin/java" ]]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
          else
            sudo apt-get update
            sudo bash scripts/reference/retry_apt_fetch.sh apt-get install -y openjdk-17-jre-headless
            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          java_major="$(java -XshowSettings:properties -version 2>&1 | awk '$1 == "java.specification.version" {print $3}')"
          if [[ "$java_major" != 17 ]]; then
            echo "Scoped model checking requires Java 17; found $java_major" >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
      - name: Restore verified reference downloads and crates
        uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-godot-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/oracle/rust/Cargo.lock') }}
      - name: Prepare the pinned editor
        run: |
          PYTHONPATH=scripts/reference python3 - <<'PY'
          from fetch import load_manifest, fetch, prepare_zip, CACHE
          import platform
          data = load_manifest()
          arch = {'aarch64': 'arm64', 'x86_64': 'x86_64'}.get(platform.machine())
          if arch is None:
              raise SystemExit('editor bootstrap supports Linux arm64/x86_64 only')
          version = "${{ matrix.version }}"
          name = f'Godot_v{version}-stable_linux.{arch}.zip'
          directory = CACHE / 'editors' / version
          directory.mkdir(parents=True, exist_ok=True)
          prepare_zip(fetch(data['artifacts'][name], name, False), directory, executable_members=(name[:-4],))
          (directory / name[:-4]).chmod(0o755)
          PY
      - name: Verify the pinned SpectatorSession model and its unsafe control
        run: |
          version="${{ matrix.version }}"
          editor=".cache/reference/editors/$version/Godot_v${version}-stable_linux.x86_64"
          python3 scripts/oracle/spectator_launch.py --godot "$editor" --output ".cache/reference/results/nightly-spectator-model-$version"
      - name: Verify the pinned handshake formal model
        # Default --formal on: the differential trace reruns here with the TLA+
        # model check and its mutant control, which the qualify oracle legs skip.
        run: |
          version="${{ matrix.version }}"
          editor=".cache/reference/editors/$version/Godot_v${version}-stable_linux.x86_64"
          python3 scripts/oracle/handshake_launch.py --godot "$editor" --output ".cache/reference/results/nightly-handshake-formal-$version"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: nightly-model-results-${{ matrix.version }}
          path: .cache/reference/results/
          if-no-files-found: error
