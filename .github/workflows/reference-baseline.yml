name: Reference Baseline

on:
  workflow_dispatch:

concurrency:
  group: spectator-request-diagnostics-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signalfish:
    name: SignalFish relay and Chromium WebRTC ${{ matrix.version }} ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ["4.7.2"]
        # Each part starts its own server and browsers, so they run as parallel jobs. The transport
        # witness splits into direct-path and mixed-path labels; the short disabled-fallback control
        # runs with the direct labels so both jobs take about as long.
        part: [online]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
      - name: Restore verified transport downloads and crates
        uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-signalfish-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/reference/browser/package-lock.json') }}
      - name: Verify the pinned sources and name the server build cache
        id: pinned
        run: |
          PYTHONPATH=scripts/reference python3 - <<'PY'
          from fetch import load_manifest, sources
          manifest = load_manifest()
          trees = sources(manifest)
          lock = trees['server'] / 'Cargo.lock'
          if not lock.is_file():
              raise SystemExit('the pinned server source has no Cargo.lock')
          print(lock)
          PY
          echo "pins=$(sha256sum docs/reference/pins.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          digest="$(sha256sum .cache/reference/signal-fish-server-*/Cargo.lock scripts/reference/signalfish_build_server.py | sha256sum | cut -d' ' -f1)"
          echo "build=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore the shared relay server build tree
        uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/reference/server-target
            .cache/reference/server-cargo
          key: reference-signalfish-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pinned.outputs.pins }}-${{ steps.pinned.outputs.build }}
          restore-keys: |
            reference-signalfish-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pinned.outputs.pins }}-
      - name: Select Ubuntu HTTPS mirror alternatives
        run: sudo bash scripts/reference/prepare_ubuntu_apt.sh /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - name: Install pinned browser runner and operating system dependencies
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          .cache/reference/browser/node_modules/.bin/playwright install-deps chromium
      - name: Build the pinned local SignalFish server
        run: |
          PYTHONPATH=scripts/reference python3 - <<'PY'
          from fetch import load_manifest
          from run import setup_rust
          manifest = load_manifest()
          setup_rust(manifest, False)
          PY
          cargo="$(RUSTUP_HOME="$PWD/.cache/reference/rustup" .cache/reference/cargo/bin/rustup which --toolchain 1.99.1 cargo)"
          python3 scripts/reference/signalfish_build_server.py \
            --cargo "$cargo" \
            --source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
            --output .cache/reference/results/signalfish-server-build
      - name: Verify real browser WebRTC on the pinned engine
        if: matrix.part == 'direct' || matrix.part == 'mixed'
        run: |
          if [[ "${{ matrix.part }}" == direct ]]; then
            labels=(clean faults corrupt default mixed-disabled peer-drop peer-drop-corrupt peer-drop-close peer-drop-answer peer-drop-relay)
          else labels=(mixed mixed-default mixed-close recording-pressure); fi
          python3 scripts/reference/signalfish_webrtc_probe.py \
            --version "${{ matrix.version }}" "${labels[@]/#/--label=}" \
            --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
            --server-source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
            --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
            --output .cache/reference/results/signalfish-webrtc
      - name: Play the shipped online example in two independent browsers
        if: matrix.part == 'online'
        run: |
          python3 scripts/reference/signalfish_webrtc_probe.py \
            --online-example --version "${{ matrix.version }}" \
            --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
            --server-source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
            --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
            --output .cache/reference/results/online-example
      - name: Verify native relay and late-event controls
        if: matrix.part == 'online'
        run: |
          for version in "${{ matrix.version }}"; do
            editor=".cache/reference/webrtc-editors/$version/Godot_v${version}-stable_linux.x86_64"
            python3 scripts/reference/signalfish_live_probe.py \
              --godot "$editor" \
              --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
              --server-source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
              --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
              --output ".cache/reference/results/signalfish-live-$version"
            python3 scripts/reference/signalfish_spectator_live.py \
              --godot "$editor" \
              --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
              --server-source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
              --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
              --output ".cache/reference/results/spectator-live-$version"
            for browser_cell in healthy initial-state room-identity viewer-departure host-departure; do
              browser_args=()
              if [ "$browser_cell" != healthy ]; then browser_args=(--browser-fault "$browser_cell"); fi
              python3 scripts/reference/signalfish_spectator_live.py \
                --godot "$editor" --browser-viewer "${browser_args[@]}" \
                --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
                --server-source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
                --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
                --output ".cache/reference/results/spectator-browser-$version-$browser_cell"
            done
            for departure in host viewer; do
              python3 scripts/reference/signalfish_spectator_live.py \
                --godot "$editor" --departure "$departure" \
                --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
                --server-source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
                --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
                --output ".cache/reference/results/spectator-live-$version-departure-$departure"
            done
            for late_signal in spectator_join_failed spectator_left spectator_disconnected; do
              python3 scripts/reference/signalfish_spectator_live.py \
                --godot "$editor" --late-signal "$late_signal" \
                --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
                --server-source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
                --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
                --output ".cache/reference/results/spectator-live-$version-$late_signal"
            done
          done
      - name: Repeat physical host departure with request diagnostics
        run: |
          editor=".cache/reference/webrtc-editors/4.7.2/Godot_v4.7.2-stable_linux.x86_64"
          for trial in 1 2 3 4 5 6; do
            python3 scripts/reference/signalfish_spectator_live.py \
              --godot "$editor" --browser-viewer --browser-fault host-departure \
              --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
              --server-source .cache/reference/signal-fish-server-8cbf5d9e5dc155e7a7a4f8f5593f0a24f8aaa560 \
              --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
              --output ".cache/reference/results/spectator-request-trial-$trial"
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: signalfish-live-reference-results-${{ matrix.version }}-${{ matrix.part }}
          # The build receipt keeps the server binary's digest and build log; the published copy is not evidence.
          path: |
            .cache/reference/results/
            !.cache/reference/results/signalfish-server-build/target/
          if-no-files-found: error
