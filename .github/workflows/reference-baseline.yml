name: Reference Baseline

on:
  push:
    branches: [main]
    paths:
      - ".llm/code-samples/**"
      - "scripts/reference/**"
      - "scripts/oracle/**"
      - "scripts/run_godot_tests.py"
      - "tests/**"
      - "addons/**"
      - "examples/**"
      - "docs/test-runner.md"
      - "docs/reference/**"
      - "Makefile"
      - ".github/workflows/reference-baseline.yml"
  pull_request:
    paths:
      - ".llm/code-samples/**"
      - "scripts/reference/**"
      - "scripts/oracle/**"
      - "scripts/run_godot_tests.py"
      - "tests/**"
      - "addons/**"
      - "examples/**"
      - "docs/test-runner.md"
      - "docs/reference/**"
      - "Makefile"
      - ".github/workflows/reference-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Reference negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make test-reference
      - run: make test-oracle

  rust:
    name: Pinned Rust reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore pinned Rust downloads and crates
        uses: actions/cache@v5
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/oracle/rust/Cargo.lock') }}
      - name: Install upstream linker prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Reproduce reference twice
        run: make reference-baseline
      - name: Verify independent integer and checksum vectors
        run: python3 scripts/reference/check_integer_vectors.py --check
      - name: Verify source inventory against the pinned extraction
        run: python3 scripts/reference/inventory.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-reference-results
          path: .cache/reference/results/
          if-no-files-found: error

  ownership:
    name: Native and Chromium snapshot ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
      - name: Restore verified reference downloads
        uses: actions/cache@v5
        with:
          path: .cache/reference/downloads
          key: reference-ownership-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json') }}
      - name: Install pinned browser runner and operating system dependencies
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          .cache/reference/browser/node_modules/.bin/playwright install-deps chromium
      - name: Verify integer encoding, snapshot ownership and byte sessions
        run: make representation-probes
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ownership-reference-results
          path: .cache/reference/results/
          if-no-files-found: error

  godot:
    name: Godot ${{ matrix.version }} ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ["4.3", "4.7.2"]
        # Suites and oracle launchers share no state, so they run as parallel jobs.
        part: [suites, integration, oracles]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
      - name: Install Java for scoped handshake model checking
        if: matrix.part == 'oracles'
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
      - name: Restore verified reference downloads and crates
        uses: actions/cache@v5
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-godot-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/oracle/rust/Cargo.lock') }}
      - name: Install pinned browser runner and operating system dependencies
        if: matrix.part != 'integration'
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          .cache/reference/browser/node_modules/.bin/playwright install-deps chromium
      - name: Execute native and exported web probes
        if: matrix.part != 'integration'
        run: python3 scripts/reference/godot_smoke.py --web
      - name: Execute native probes
        if: matrix.part == 'integration'
        run: python3 scripts/reference/godot_smoke.py
      - name: Verify runner failure controls and fresh-process suites
        if: matrix.part == 'suites'
        run: |
          version="${{ matrix.version }}"
          editor=".cache/reference/editors/$version/Godot_v${version}-stable_linux.x86_64"
          python3 scripts/reference/package_audit.py --godot "$editor" --output ".cache/reference/results/package-$version"
          python3 scripts/reference/test_package_audit.py --godot "$editor" -v
          python3 scripts/reference/signalfish_probe.py --godot "$editor" --output ".cache/reference/results/signalfish-$version"
          python3 scripts/reference/test_godot_runner.py --godot "$editor" -v
          python3 scripts/run_godot_tests.py --godot "$editor" --timeout 180 --results ".cache/tests/runner-$version.json"
          python3 scripts/run_godot_tests.py --godot "$editor" --category determinism --results ".cache/tests/determinism-$version.json"
      - name: Run integration suites one case at a time
        if: matrix.part == 'integration'
        run: |
          version="${{ matrix.version }}"
          editor=".cache/reference/editors/$version/Godot_v${version}-stable_linux.x86_64"
          for case in default_single default_batched readiness_boundary aborted_wait; do
            case_timeout=120
            if [[ "$case" == default_single ]]; then case_timeout=180; fi
            python3 scripts/run_godot_tests.py --godot "$editor" --category integration --filter "$case" --timeout "$case_timeout" \
              --results ".cache/tests/integration-$version-$case.json"
          done
      - name: Compare actual upstream and Godot traces
        if: matrix.part == 'oracles'
        run: |
          version="${{ matrix.version }}"
          editor=".cache/reference/editors/$version/Godot_v${version}-stable_linux.x86_64"
          python3 scripts/oracle/queue_launch.py --godot "$editor" --output ".cache/reference/results/queue-$version"
          python3 scripts/oracle/launch.py --godot "$editor" --output ".cache/reference/results/oracle-$version"
          python3 scripts/oracle/handshake_launch.py --godot "$editor" --output ".cache/reference/results/handshake-$version"
          python3 scripts/oracle/p2p_launch.py --godot "$editor" --output ".cache/reference/results/p2p-$version"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: godot-browser-reference-results-${{ matrix.version }}-${{ matrix.part }}
          path: |
            .cache/reference/results/
            .cache/tests/
          if-no-files-found: error

  signalfish:
    name: SignalFish relay and Chromium WebRTC ${{ matrix.version }} ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ["4.3", "4.7.2"]
        # Each part starts its own server and browsers, so they run as parallel jobs.
        # The transport witness splits into direct-only and mixed-path labels.
        part: [direct, mixed, online, relay]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
      - name: Restore verified transport downloads and crates
        uses: actions/cache@v5
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-signalfish-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/reference/browser/package-lock.json') }}
      - name: Install pinned browser runner and operating system dependencies
        if: matrix.part != 'relay'
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          .cache/reference/browser/node_modules/.bin/playwright install-deps chromium
      - name: Build the pinned local SignalFish server
        run: |
          PYTHONPATH=scripts/reference python3 - <<'PY'
          from fetch import load_manifest, sources
          from run import setup_rust
          manifest = load_manifest()
          sources(manifest)
          setup_rust(manifest, False)
          PY
          cargo="$(RUSTUP_HOME="$PWD/.cache/reference/rustup" .cache/reference/cargo/bin/rustup which --toolchain 1.94.0 cargo)"
          python3 scripts/reference/signalfish_build_server.py \
            --cargo "$cargo" \
            --source .cache/reference/signal-fish-server-9c2fb8fa635a69241b8ccf38be651d561fef7434 \
            --output .cache/reference/results/signalfish-server-build
      - name: Verify real browser WebRTC on the pinned engine
        if: matrix.part == 'direct' || matrix.part == 'mixed'
        run: |
          if [[ "${{ matrix.part }}" == direct ]]; then labels=(clean faults corrupt default); else labels=(mixed mixed-default mixed-disabled mixed-close); fi
          python3 scripts/reference/signalfish_webrtc_probe.py \
            --version "${{ matrix.version }}" "${labels[@]/#/--label=}" \
            --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
            --server-source .cache/reference/signal-fish-server-9c2fb8fa635a69241b8ccf38be651d561fef7434 \
            --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
            --output .cache/reference/results/signalfish-webrtc
      - name: Play the shipped online example in two independent browsers
        if: matrix.part == 'online'
        run: |
          python3 scripts/reference/signalfish_webrtc_probe.py \
            --online-example --version "${{ matrix.version }}" \
            --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
            --server-source .cache/reference/signal-fish-server-9c2fb8fa635a69241b8ccf38be651d561fef7434 \
            --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
            --output .cache/reference/results/online-example
      - name: Verify native relay and late-event controls
        if: matrix.part == 'relay'
        run: |
          version="${{ matrix.version }}"
          PYTHONPATH=scripts/reference python3 - "$version" <<'PY'
          import sys, zipfile
          from fetch import CACHE, fetch, load_manifest
          name = f'Godot_v{sys.argv[1]}-stable_linux.x86_64.zip'
          with zipfile.ZipFile(fetch(load_manifest()['artifacts'][name], name, False)) as package:
              package.extractall(CACHE / 'webrtc-editors' / sys.argv[1])
          PY
          editor=".cache/reference/webrtc-editors/$version/Godot_v${version}-stable_linux.x86_64"
          chmod +x "$editor"
          python3 scripts/reference/signalfish_live_probe.py \
            --godot "$editor" \
            --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
            --server-source .cache/reference/signal-fish-server-9c2fb8fa635a69241b8ccf38be651d561fef7434 \
            --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
            --output ".cache/reference/results/signalfish-live-$version"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: signalfish-live-reference-results-${{ matrix.version }}-${{ matrix.part }}
          path: .cache/reference/results/
          if-no-files-found: error
