name: Reference Baseline

on:
  push:
    branches: [main]
    paths:
      - ".llm/code-samples/**"
      - "scripts/reference/**"
      - "scripts/oracle/**"
      - "scripts/run_godot_tests.py"
      - "tests/**"
      - "addons/**"
      - "docs/test-runner.md"
      - "docs/reference/**"
      - "Makefile"
      - ".github/workflows/reference-baseline.yml"
  pull_request:
    paths:
      - ".llm/code-samples/**"
      - "scripts/reference/**"
      - "scripts/oracle/**"
      - "scripts/run_godot_tests.py"
      - "tests/**"
      - "addons/**"
      - "docs/test-runner.md"
      - "docs/reference/**"
      - "Makefile"
      - ".github/workflows/reference-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Reference negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make test-reference
      - run: make test-oracle

  rust:
    name: Pinned Rust reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore pinned Rust downloads and crates
        uses: actions/cache@v5
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/oracle/rust/Cargo.lock') }}
      - name: Install upstream linker prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Reproduce reference twice
        run: make reference-baseline
      - name: Verify independent integer and checksum vectors
        run: python3 scripts/reference/check_integer_vectors.py --check
      - name: Verify source inventory against the pinned extraction
        run: python3 scripts/reference/inventory.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-reference-results
          path: .cache/reference/results/
          if-no-files-found: error

  godot:
    name: Minimum/current Godot and Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
      - name: Install Java for scoped handshake model checking
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
      - name: Restore verified reference downloads and crates
        uses: actions/cache@v5
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-godot-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/oracle/rust/Cargo.lock') }}
      - name: Install pinned browser runner and operating system dependencies
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          .cache/reference/browser/node_modules/.bin/playwright install-deps chromium
      - name: Execute native and exported web probes
        run: python3 scripts/reference/godot_smoke.py --web
      - name: Verify integer encoding, snapshot ownership and byte handshakes
        run: make representation-probes
      - name: Verify runner failure controls and fresh-process suites
        run: |
          for version in 4.3 4.7.2; do
            editor=".cache/reference/editors/$version/Godot_v${version}-stable_linux.x86_64"
            python3 scripts/reference/package_audit.py --godot "$editor" --output ".cache/reference/results/package-$version"
            python3 scripts/reference/test_godot_runner.py --godot "$editor" -v
            python3 scripts/run_godot_tests.py --godot "$editor" --results ".cache/tests/runner-$version.json"
            python3 scripts/run_godot_tests.py --godot "$editor" --category determinism --results ".cache/tests/determinism-$version.json"
            python3 scripts/oracle/queue_launch.py --godot "$editor" --output ".cache/reference/results/queue-$version"
            python3 scripts/oracle/launch.py --godot "$editor" --output ".cache/reference/results/oracle-$version"
            python3 scripts/oracle/handshake_launch.py --godot "$editor" --output ".cache/reference/results/handshake-$version"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: godot-browser-reference-results
          path: |
            .cache/reference/results/
            .cache/tests/
          if-no-files-found: error
