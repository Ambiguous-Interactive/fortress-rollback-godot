name: Reference Baseline
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ownership:
    name: Native and Chromium snapshot ownership ${{ matrix.version }}${{ matrix.suffix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: "4.3", browser: chromium, phase: positive, suite_part: "2of5", suffix: " positive part 2 trial 1", part_suffix: "-positive-part-2-1"}
          - {version: "4.3", browser: chromium, phase: positive, suite_part: "2of5", suffix: " positive part 2 trial 2", part_suffix: "-positive-part-2-2"}
          - {version: "4.3", browser: chromium, phase: positive, suite_part: "2of5", suffix: " positive part 2 trial 3", part_suffix: "-positive-part-2-3"}
          - {version: "4.3", browser: chromium, phase: positive, suite_part: "2of5", suffix: " positive part 2 trial 4", part_suffix: "-positive-part-2-4"}
          - {version: "4.3", browser: chromium, phase: positive, suite_part: "2of5", suffix: " positive part 2 trial 5", part_suffix: "-positive-part-2-5"}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ce384c3ebd374003fda1a4698746f07ad5debe6d
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          # The browser tooling is reinstall per job; a shared npm download cache
          # keeps `npm ci` off the registry on the warm path without changing
          # what is installed.
          cache: npm
          cache-dependency-path: scripts/reference/browser/package-lock.json
      - uses: ./.github/actions/reference-browser-cache
        with:
          version: ${{ matrix.version }}
          browser: ${{ matrix.browser }}
          legacy-ownership-cache: "true"
      - name: Select Ubuntu HTTPS mirror alternatives
        run: sudo bash scripts/reference/prepare_ubuntu_apt.sh /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
      - name: Install pinned browser runner and operating system dependencies
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          bash scripts/reference/retry_apt_fetch.sh .cache/reference/browser/node_modules/.bin/playwright install-deps chromium
      - name: Verify integer encoding, snapshot ownership and byte sessions
        run: |
          python3 scripts/reference/ownership_probes.py --web --version "${{ matrix.version }}" \
            --phase "${{ matrix.phase }}" --suite-part "${{ matrix.suite_part }}" --balance-chromium
      - name: Verify spectator browser control origins
        if: matrix.browser == 'chromium' && matrix.version == '4.3' && matrix.phase == 'negative' && matrix.suite_part == '1of5'
        env:
          PYTHONPATH: scripts/reference
          FORTRESS_PLAYWRIGHT_PACKAGE: ${{ github.workspace }}/.cache/reference/browser/node_modules/@playwright/test
          FORTRESS_CHROMIUM_EXECUTABLE: ${{ github.workspace }}/.cache/reference/ownership-chromium/x86_64/chrome-linux64/chrome
        run: python3 -m unittest test_spectator_control.SpectatorControlTests.test_actual_browser_preflight_and_capability_separation
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ownership-reference-results-${{ matrix.version }}${{ matrix.part_suffix }}
          path: .cache/reference/results/
          if-no-files-found: error

  units:
    name: Unit layout ${{ matrix.count }} part ${{ matrix.part }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        count: [3, 4]
        part: [0, 1, 2, 3]
        exclude:
          - {count: 3, part: 3}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 73924652282ae1c98d0d29d77d7fa98c502548ce
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - name: Plan identical inventories
        env:
          COUNT: ${{ matrix.count }}
        run: |
          PYTHONPATH=scripts python3 - <<'PYTHON'
          import json, os, unit_gate as g
          p = g.plan("f6fa581")
          assert len(p["parts"]) == 4
          p["parts"] = g.balance_suites(g.suite_weights(p["selection"]["suites"], g.load_durations(g.WEIGHTS)), int(os.environ["COUNT"]))
          with open(os.environ["GITHUB_ENV"], "a") as out:
              print("UNIT_PLAN=" + json.dumps(p, separators=(",", ":")), file=out)
          PYTHON
      - name: Run the affected unit suites
        run: python3 scripts/unit_gate.py run --part ${{ matrix.part }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-layout-${{ matrix.count }}-${{ matrix.part }}
          path: .cache/tests/gate-unit-part-*.json
