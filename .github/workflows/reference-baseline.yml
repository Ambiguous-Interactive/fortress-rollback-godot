name: Reference Baseline

on:
  push:
    branches: [main]
    paths:
      - ".llm/code-samples/**"
      - "scripts/reference/**"
      - "scripts/oracle/**"
      - "scripts/run_godot_tests.py"
      - "scripts/package_addon.py"
      - "docs/package.md"
      - "tests/**"
      - "addons/**"
      - "examples/**"
      - "docs/test-runner.md"
      - "docs/reference/**"
      - "Makefile"
      - ".github/workflows/reference-baseline.yml"
  pull_request:
    paths:
      - ".llm/code-samples/**"
      - "scripts/reference/**"
      - "scripts/oracle/**"
      - "scripts/run_godot_tests.py"
      - "scripts/package_addon.py"
      - "docs/package.md"
      - "tests/**"
      - "addons/**"
      - "examples/**"
      - "docs/test-runner.md"
      - "docs/reference/**"
      - "Makefile"
      - ".github/workflows/reference-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Reference negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make test-reference
      - run: make test-oracle

  rust:
    name: Pinned Rust reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore pinned Rust downloads and crates
        uses: actions/cache@v5
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/oracle/rust/Cargo.lock') }}
      - name: Install upstream linker prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Reproduce reference twice
        run: make reference-baseline
      - name: Verify independent integer and checksum vectors
        run: python3 scripts/reference/check_integer_vectors.py --check
      - name: Verify source inventory against the pinned extraction
        run: python3 scripts/reference/inventory.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rust-reference-results
          path: .cache/reference/results/
          if-no-files-found: error

  ownership:
    name: Native and ${{ matrix.browser == 'firefox' && 'Firefox' || 'Chromium' }} snapshot ownership ${{ matrix.version }}${{ matrix.suffix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: "4.3", browser: chromium, phase: both, suite_part: all, suffix: "", part_suffix: ""}
          - {version: "4.7.2", browser: chromium, phase: both, suite_part: all, suffix: "", part_suffix: ""}
          - {version: "4.3", browser: firefox, phase: negative, suite_part: "1", suffix: " negative part 1", part_suffix: "-part-1"}
          - {version: "4.3", browser: firefox, phase: negative, suite_part: "2", suffix: " negative part 2", part_suffix: "-part-2"}
          - {version: "4.3", browser: firefox, phase: positive, suite_part: "1", suffix: " positive part 1", part_suffix: "-part-1"}
          - {version: "4.3", browser: firefox, phase: positive, suite_part: "2", suffix: " positive part 2", part_suffix: "-part-2"}
          - {version: "4.7.2", browser: firefox, phase: negative, suite_part: "1", suffix: " negative part 1", part_suffix: "-part-1"}
          - {version: "4.7.2", browser: firefox, phase: negative, suite_part: "2", suffix: " negative part 2", part_suffix: "-part-2"}
          - {version: "4.7.2", browser: firefox, phase: positive, suite_part: "1", suffix: " positive part 1", part_suffix: "-part-1"}
          - {version: "4.7.2", browser: firefox, phase: positive, suite_part: "2", suffix: " positive part 2", part_suffix: "-part-2"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
      - name: Restore verified reference downloads
        uses: actions/cache@v5
        with:
          path: .cache/reference/downloads
          key: reference-ownership-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json') }}
      - name: Install pinned browser runner and operating system dependencies
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          .cache/reference/browser/node_modules/.bin/playwright install-deps "${{ matrix.browser }}"
          if [[ "${{ matrix.browser }}" == firefox ]]; then
            sudo apt-get update
            sudo apt-get install -y xvfb xdotool
          fi
      - name: Verify integer encoding, snapshot ownership and byte sessions
        run: |
          if [[ "${{ matrix.browser }}" == firefox ]]; then
            xvfb-run -a python3 scripts/reference/ownership_probes.py --web --browser firefox \
              --version "${{ matrix.version }}" --phase "${{ matrix.phase }}" --suite-part "${{ matrix.suite_part }}"
          else
            python3 scripts/reference/ownership_probes.py --web --version "${{ matrix.version }}"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ownership-reference-results-${{ matrix.version }}${{ matrix.browser == 'firefox' && format('-firefox-{0}', matrix.phase) || '' }}${{ matrix.part_suffix }}
          path: .cache/reference/results/
          if-no-files-found: error

  godot:
    name: Godot ${{ matrix.version }} and Chromium ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ["4.3", "4.7.2"]
        # Suites and oracle launchers share no state, so they run as parallel jobs.
        part: [suites, oracles]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
      - name: Select Java 17 for scoped model checking
        if: matrix.part == 'oracles'
        run: |
          if [[ -n "${JAVA_HOME_17_X64:-}" && -x "$JAVA_HOME_17_X64/bin/java" ]]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
          else
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jre-headless
            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          java_major="$(java -XshowSettings:properties -version 2>&1 | awk '$1 == "java.specification.version" {print $3}')"
          if [[ "$java_major" != 17 ]]; then
            echo "Scoped model checking requires Java 17; found $java_major" >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
      - name: Restore verified reference downloads and crates
        uses: actions/cache@v5
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-godot-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/oracle/rust/Cargo.lock') }}
      - name: Install pinned browser runner and operating system dependencies
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          .cache/reference/browser/node_modules/.bin/playwright install-deps chromium
      - name: Execute native and exported web probes
        # The exported representation and protocol probes are identical for both legs, so the
        # suites leg owns them and the oracles leg keeps only its own native work.
        if: matrix.part == 'suites'
        run: python3 scripts/reference/godot_smoke.py --web --version "${{ matrix.version }}"
      - name: Execute the native engine probes for the oracle launchers
        # The oracle launchers need the pinned engine, so this leg keeps the native probes
        # and leaves the exported web probe to the suites leg.
        if: matrix.part == 'oracles'
        run: python3 scripts/reference/godot_smoke.py --version "${{ matrix.version }}"
      - name: Verify runner failure controls and fresh-process suites
        if: matrix.part == 'suites'
        run: |
          version="${{ matrix.version }}"
          editor=".cache/reference/editors/$version/Godot_v${version}-stable_linux.x86_64"
          python3 scripts/reference/package_audit.py --godot "$editor" --output ".cache/reference/results/package-$version"
          python3 scripts/reference/test_package_audit.py --godot "$editor" -v
          python3 scripts/reference/signalfish_probe.py --godot "$editor" --output ".cache/reference/results/signalfish-$version"
          python3 scripts/reference/test_godot_runner.py --godot "$editor" -v
          python3 scripts/run_godot_tests.py --godot "$editor" --timeout 180 --results ".cache/tests/runner-$version.json"
          for case in default_single default_batched readiness_boundary aborted_wait; do
            case_timeout=120
            if [[ "$case" == default_single ]]; then case_timeout=180; fi
            python3 scripts/run_godot_tests.py --godot "$editor" --category integration --filter "$case" --timeout "$case_timeout" \
              --results ".cache/tests/integration-$version-$case.json"
          done
          python3 scripts/run_godot_tests.py --godot "$editor" --category determinism --results ".cache/tests/determinism-$version.json"
      - name: Compare actual upstream and Godot traces
        if: matrix.part == 'oracles'
        run: |
          version="${{ matrix.version }}"
          editor=".cache/reference/editors/$version/Godot_v${version}-stable_linux.x86_64"
          python3 scripts/oracle/queue_launch.py --godot "$editor" --output ".cache/reference/results/queue-$version"
          python3 scripts/oracle/launch.py --godot "$editor" --output ".cache/reference/results/oracle-$version"
          python3 scripts/oracle/replay_launch.py --godot "$editor" --output ".cache/reference/results/replay-$version"
          python3 scripts/oracle/handshake_launch.py --godot "$editor" --output ".cache/reference/results/handshake-$version"
          python3 scripts/oracle/p2p_launch.py --godot "$editor" --output ".cache/reference/results/p2p-$version"
          python3 scripts/oracle/drop_history_launch.py --godot "$editor" --output ".cache/reference/results/drop-history-$version"
      - name: Verify the pinned SpectatorSession model and its unsafe control
        if: matrix.part == 'oracles'
        run: |
          version="${{ matrix.version }}"
          editor=".cache/reference/editors/$version/Godot_v${version}-stable_linux.x86_64"
          python3 scripts/oracle/spectator_launch.py --godot "$editor" --output ".cache/reference/results/spectator-model-$version"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: godot-browser-reference-results-${{ matrix.version }}-${{ matrix.part }}
          path: |
            .cache/reference/results/
            .cache/tests/
          if-no-files-found: error

  signalfish:
    name: SignalFish relay and Chromium WebRTC ${{ matrix.version }} ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ["4.3", "4.7.2"]
        # Each part starts its own server and browsers, so they run as parallel jobs. The transport
        # witness splits into direct-path and mixed-path labels; the short disabled-fallback control
        # runs with the direct labels so both jobs take about as long.
        part: [direct, mixed, online]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
      - name: Restore verified transport downloads and crates
        uses: actions/cache@v5
        with:
          path: |
            .cache/reference/downloads
            .cache/reference/cargo/registry/cache
            .cache/reference/cargo/registry/index
          key: reference-signalfish-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/reference/pins.json', 'scripts/reference/browser/package-lock.json') }}
      - name: Verify the pinned sources and name the server build cache
        id: pinned
        run: |
          PYTHONPATH=scripts/reference python3 - <<'PY'
          from fetch import load_manifest, sources
          manifest = load_manifest()
          trees = sources(manifest)
          lock = trees['server'] / 'Cargo.lock'
          if not lock.is_file():
              raise SystemExit('the pinned server source has no Cargo.lock')
          print(lock)
          PY
          echo "pins=$(sha256sum docs/reference/pins.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          digest="$(sha256sum .cache/reference/signal-fish-server-*/Cargo.lock scripts/reference/signalfish_build_server.py | sha256sum | cut -d' ' -f1)"
          echo "build=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore the shared relay server build tree
        uses: actions/cache@v5
        with:
          path: |
            .cache/reference/server-target
            .cache/reference/server-cargo
          key: reference-signalfish-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pinned.outputs.pins }}-${{ steps.pinned.outputs.build }}
          restore-keys: |
            reference-signalfish-server-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pinned.outputs.pins }}-
      - name: Install pinned browser runner and operating system dependencies
        run: |
          mkdir -p .cache/reference/browser
          cp scripts/reference/browser/package*.json .cache/reference/browser/
          npm ci --ignore-scripts --prefix .cache/reference/browser
          .cache/reference/browser/node_modules/.bin/playwright install-deps chromium
      - name: Build the pinned local SignalFish server
        run: |
          PYTHONPATH=scripts/reference python3 - <<'PY'
          from fetch import load_manifest
          from run import setup_rust
          manifest = load_manifest()
          setup_rust(manifest, False)
          PY
          cargo="$(RUSTUP_HOME="$PWD/.cache/reference/rustup" .cache/reference/cargo/bin/rustup which --toolchain 1.94.0 cargo)"
          python3 scripts/reference/signalfish_build_server.py \
            --cargo "$cargo" \
            --source .cache/reference/signal-fish-server-9c2fb8fa635a69241b8ccf38be651d561fef7434 \
            --output .cache/reference/results/signalfish-server-build
      - name: Verify real browser WebRTC on the pinned engine
        if: matrix.part == 'direct' || matrix.part == 'mixed'
        run: |
          if [[ "${{ matrix.part }}" == direct ]]; then
            labels=(clean faults corrupt default mixed-disabled peer-drop peer-drop-corrupt peer-drop-close peer-drop-answer)
          else labels=(mixed mixed-default mixed-close); fi
          python3 scripts/reference/signalfish_webrtc_probe.py \
            --version "${{ matrix.version }}" "${labels[@]/#/--label=}" \
            --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
            --server-source .cache/reference/signal-fish-server-9c2fb8fa635a69241b8ccf38be651d561fef7434 \
            --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
            --output .cache/reference/results/signalfish-webrtc
      - name: Play the shipped online example in two independent browsers
        if: matrix.part == 'online'
        run: |
          python3 scripts/reference/signalfish_webrtc_probe.py \
            --online-example --version "${{ matrix.version }}" \
            --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
            --server-source .cache/reference/signal-fish-server-9c2fb8fa635a69241b8ccf38be651d561fef7434 \
            --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
            --output .cache/reference/results/online-example
      - name: Verify native relay and late-event controls
        if: matrix.part == 'online'
        run: |
          for version in "${{ matrix.version }}"; do
            editor=".cache/reference/webrtc-editors/$version/Godot_v${version}-stable_linux.x86_64"
            python3 scripts/reference/signalfish_live_probe.py \
              --godot "$editor" \
              --server .cache/reference/results/signalfish-server-build/target/debug/signal-fish-server \
              --server-source .cache/reference/signal-fish-server-9c2fb8fa635a69241b8ccf38be651d561fef7434 \
              --build-receipt .cache/reference/results/signalfish-server-build/build-receipt.json \
              --output ".cache/reference/results/signalfish-live-$version"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: signalfish-live-reference-results-${{ matrix.version }}-${{ matrix.part }}
          # The build receipt keeps the server binary's digest and build log; the published copy is not evidence.
          path: |
            .cache/reference/results/
            !.cache/reference/results/signalfish-server-build/target/
          if-no-files-found: error
