name: Devcontainer Verify

# Guards the devcontainer: shell script linting, config validity, a full
# image build (features included), and the acceptance harness run inside the
# freshly built container. Fresh runners always create fresh containers.
# Both architectures are covered: the Dockerfile's arch branches
# (x86_64/arm64) are the paths real users take.

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".mcp.json"
      - "opencode.json"
      - "Makefile"
      - ".githooks/**"
      - "scripts/**"
      - ".github/workflows/devcontainer.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".mcp.json"
      - "opencode.json"
      - "Makefile"
      - ".githooks/**"
      - "scripts/**"
      - ".github/workflows/devcontainer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Lint shell scripts
        run: shellcheck -S warning .devcontainer/*.sh

      - name: Validate JSON configs
        # devcontainer.json is intentionally excluded: the devcontainer spec
        # allows JSONC, and `up` validates it. These two must stay pure JSON.
        # Server CONTENT is asserted, not just key presence: an all-empty
        # mcp.servers object would pass a `has()` check with zero MCP tools.
        run: |
          jq -e . .mcp.json opencode.json >/dev/null
          jq -e '
            (.mcpServers | has("godot") and has("context7") and has("github"))
            and (.mcpServers.godot.command == "godot-mcp")
            and (.mcpServers.godot.env.GODOT_PATH == "/usr/local/bin/godot")
            and (.mcpServers.context7.url | test("^https://"))
            and (.mcpServers.github.url | test("^https://"))
          ' .mcp.json >/dev/null
          jq -e '
            (.mcp.servers | has("godot") and has("context7") and has("github"))
            and ([.mcp.servers[] | (if has("disabled") then .disabled else false end)] | all(. == false))
            and (.mcp.servers.godot.type == "local")
            and (.mcp.servers.godot.command == ["godot-mcp"])
            and (.mcp.servers.godot.environment.GODOT_PATH == "/usr/local/bin/godot")
            and (.mcp.servers.context7.type == "remote")
            and (.mcp.servers.context7.url | test("^https://"))
            and (.mcp.servers.github.type == "remote")
            and (.mcp.servers.github.url | test("^https://"))
            and (.mcp.servers.github.oauth == false)
          ' opencode.json >/dev/null

      - name: Build and start devcontainer
        run: npx -y @devcontainers/cli@0.89.0 up --workspace-folder . --frozen-lockfile

      - name: Acceptance harness inside container
        # postCreateCommand already ran the FULL verify.sh during up; the exec
        # re-runs the quick subset for a clean pass/fail line in the log.
        run: npx -y @devcontainers/cli@0.89.0 exec --workspace-folder . -- bash .devcontainer/verify.sh --quick
