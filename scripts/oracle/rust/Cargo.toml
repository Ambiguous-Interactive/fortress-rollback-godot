[package]
name = "fortress-development-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fortress-rollback = { path = "../../../.cache/reference/fortress-rollback-25e8020d1a5fd40c4f16b37f97b5ec5329a8566d", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
web-time = "=1.1.0"

[features]
coordinator-failover = []
replay-recovery = []
handshake-oracle = ["fortress-rollback/trace-validation"]
spectator-status = ["fortress-rollback/hot-join"]

[[bin]]
name = "handshake"
path = "src/bin/handshake.rs"
required-features = ["handshake-oracle"]

[[bin]]
name = "p2p"
path = "src/bin/p2p.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
