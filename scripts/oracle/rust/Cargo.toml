[package]
name = "fortress-development-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fortress-rollback = { path = "../../../.cache/reference/fortress-rollback-d124c89080004d96971a629bb0427056ee1805e3", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
web-time = "=1.1.0"

[features]
handshake-oracle = ["fortress-rollback/trace-validation"]

[[bin]]
name = "handshake"
path = "src/bin/handshake.rs"
required-features = ["handshake-oracle"]

[[bin]]
name = "p2p"
path = "src/bin/p2p.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
