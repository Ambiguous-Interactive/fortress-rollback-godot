[package]
name = "fortress-development-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fortress-rollback = { path = "../../../.cache/reference/fortress-rollback-f13cd5c0f2815926785a395947e18da0dbea0dd8", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
web-time = "=1.1.0"

[features]
handshake-oracle = ["fortress-rollback/trace-validation"]

[[bin]]
name = "handshake"
path = "src/bin/handshake.rs"
required-features = ["handshake-oracle"]

[[bin]]
name = "p2p"
path = "src/bin/p2p.rs"
